<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaturaFacil | Alagoinhas Telecom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#00baa4">

    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FaturaFacil">
    <link rel="apple-touch-icon" href="assets/img/logo_icon.png">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/css/style.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Login View -->
        <section id="login-view" class="view active">
            <header class="brand-header">
                <img src="assets/img/logo.png" alt="Logo Alagoinhas Telecom" class="logo-img">
                <h1>FaturaFacil</h1>
                <p>Sua fatura em segundos, sem burocracia.</p>
            </header>

            <div class="card login-card">
                <form id="search-form">
                    <div class="input-group">
                        <label for="cpf">CPF ou CNPJ</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-id-card"></i>
                            <input type="tel" id="cpf" placeholder="000.000.000-00 ou 00.000.000/0000-00" maxlength="18"
                                autocomplete="off">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" id="btn-search">
                        <span>BUSCAR FATURAS</span>
                        <div class="spinner hidden"></div>
                    </button>
                </form>
            </div>
        </section>

        <!-- Contracts View -->
        <section id="contracts-view" class="view hidden">
            <div class="view-header">
                <button class="btn-round btn-back" data-target="login-view"><i
                        class="fa-solid fa-arrow-left"></i></button>
                <h2>Selecione o Contrato</h2>
                <button class="btn-round btn-logout" title="Sair"><i
                        class="fa-solid fa-right-from-bracket"></i></button>
            </div>
            <div id="contracts-list" class="list-container">
                <!-- Populated via JS -->
            </div>
        </section>

        <!-- Invoices View -->
        <section id="invoices-view" class="view hidden">

            <!-- Maintenance Alert Area -->
            <div id="maintenance-container"></div>

            <div class="view-header">
                <button class="btn-round btn-back" data-target="login-view"><i
                        class="fa-solid fa-arrow-left"></i></button>
                <h2>Faturas em Aberto</h2>
                <div style="display:flex;gap:5px">
                    <button id="btn-enable-push" class="btn-round btn-push" title="Receber Alertas"><i
                            class="fa-solid fa-bell"></i></button>
                    <button class="btn-round btn-logout" title="Sair"><i
                            class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>

            <div class="contract-summary">
                <span class="user-name" id="user-name-display">Cliente</span>
                <span class="contract-id-display">Contrato #<span id="contract-id-display">0000</span></span>
            </div>

            <!-- New Dashboard Cards -->
            <div id="dashboard-grid" class="dashboard-grid hidden">
                <div class="dash-card">
                    <i class="fa-solid fa-rocket"></i>
                    <div>
                        <small>Plano</small>
                        <strong id="dash-plan">---</strong>
                    </div>
                </div>
                <div class="dash-card">
                    <i class="fa-solid fa-file-contract"></i>
                    <div>
                        <small>Status</small>
                        <strong id="dash-status">---</strong>
                    </div>
                </div>
                <div class="dash-card">
                    <i class="fa-solid fa-globe"></i>
                    <div>
                        <small>Conexão</small>
                        <strong id="dash-conn">---</strong>
                    </div>
                </div>
            </div>

            <div id="unlock-container" class="hidden" style="margin-bottom: 1rem;">
                <button id="btn-unlock" class="btn-unlock">
                    <i class="fa-solid fa-lock-open"></i> Desbloqueio de Confiança
                </button>
            </div>

            <!-- Send Invoice Actions -->
            <div class="actions-grid">
                <button class="btn-action-lg btn-send-email" title="Enviar faturas por E-mail">
                    <i class="fa-solid fa-envelope"></i> Enviar por E-mail
                </button>
                <button class="btn-action-lg btn-send-sms" title="Enviar faturas por SMS">
                    <i class="fa-solid fa-comment-sms"></i> Enviar por SMS
                </button>
            </div>

            <div id="invoices-list" class="list-container">
                <!-- Populated via JS -->
            </div>
        </section>
    </div>

    <!-- WhatsApp Floating Button -->
    <a id="whatsapp-btn" href="#" target="_blank" class="whatsapp-float hidden">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- PWA Install Popup (Mobile) -->
    <div id="pwa-install-banner" class="pwa-banner hidden">
        <div class="pwa-content">
            <img src="assets/img/logo_icon.png" alt="App Icon" class="pwa-icon">
            <div class="pwa-info">
                <strong>Instalar FaturaFacil</strong>
                <span>Acesse suas faturas mais rápido</span>
            </div>
        </div>
        <div class="pwa-actions">
            <button id="btn-pwa-dismiss" class="btn-text">Agora não</button>
            <button id="btn-pwa-install" class="btn-primary-sm">Instalar</button>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Maintenance Modal -->
    <div id="maintenance-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fa-solid fa-triangle-exclamation" id="modal-icon"></i>
                <h3 id="modal-title">Aviso de Manutenção</h3>
                <button class="btn-close-modal" id="btn-close-maintenance">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content injected here -->
            </div>
            <div class="modal-footer">
                <button class="btn-primary-sm full-width" id="btn-ack-maintenance">Estou ciente</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/js/main.js?v=2.2"></script>
</body>

</html>
